
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dienstnummern | Polizei NRP</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1424;
    color: #ffffff;
}

header {
    background: #101d32;
    padding: 25px 20px;
    text-align: center;
    border-bottom: 2px solid #d5b66c;
}

header h1 {
    margin: 0;
    color: #d5b66c;
    font-size: 28px;
}

header p {
    color: #b8c2d3;
    margin: 8px 0 0;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.back {
    display: inline-block;
    color: #d5b66c;
    text-decoration: none;
    margin-bottom: 20px;
}

.back:hover {
    text-decoration: underline;
}

.info {
    background: #14243b;
    border: 1px solid #263a58;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 22px;
    color: #cbd5e1;
}

.search {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #34445e;
    background: #14243b;
    color: white;
    font-size: 15px;
    margin-bottom: 20px;
}

.search:focus {
    outline: none;
    border-color: #d5b66c;
}

.table-wrapper {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid #263a58;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
    background: #101d32;
}

th {
    background: #1b2d48;
    color: #d5b66c;
    text-align: left;
    padding: 15px;
}

td {
    padding: 13px 15px;
    border-top: 1px solid #263a58;
    color: #e2e8f0;
}

tr:hover td {
    background: #172943;
}

.number {
    color: #d5b66c;
    font-weight: bold;
    white-space: nowrap;
}

.rank {
    color: #d5b66c;
}

.free {
    color: #8290a5;
    font-style: italic;
}

footer {
    text-align: center;
    color: #718096;
    padding: 30px 15px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>Polizei NRP</h1>
    <p>Dienstnummernverzeichnis</p>
</header>

<div class="container">

    <a class="back" href="../index.html">← Zur Hauptseite</a>

    <div class="info">
        Hier befindet sich das Dienstnummernverzeichnis der Polizei NRP.
        Die Übersicht enthält die vergebenen Dienstnummern, Namen und Dienstgrade.
    </div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Dienstnummer, Name oder Dienstgrad suchen..."
        oninput="renderTable()"
    >

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Dienstnummer</th>
                    <th>Name</th>
                    <th>Roblox-Name</th>
                    <th>Anzeigename</th>
                    <th>Dienstgrad</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>
        </table>
    </div>

</div>

<footer>
    Polizei NRP | Internes Dienstnummernverzeichnis
</footer>

<script>
const employees = {
    1: {
        name: "Fynn Mayer",
        roblox: "@Hhhhgffzfzguv",
        display: "SCP_035",
        rank: "LPP | Landespolizeipräsident"
    },

    2: {
        name: "Can Kowalcyk",
        roblox: "@canderking1106",
        display: "C4NX",
        rank: "LPVP | Landespolizeivizepräsident"
    },

    3: {
        name: "Vladimir Aqua",
        roblox: "@aqualost_334",
        display: "aquaboy_229",
        rank: "PP | Polizeipräsident"
    },

    5: {
        name: "Finley Kowalczyk",
        roblox: "@Fillusch",
        display: "Iglo_Fischring",
        rank: "LPD | Leitender Polizeidirektor"
    },

    12: {
        name: "Yanbo Schmidt",
        roblox: "@Starchriss77",
        display: "Yanbo13",
        rank: "PHK | Polizeihauptkommissar"
    },

    33: {
        name: "Test",
        roblox: "@Test",
        display: "Test",
        rank: "Test"
    },

    45: {
        name: "Vincent Müller",
        roblox: "@VinOver0",
        display: "VinOver0",
        rank: "T-LAB | Test LTD. Ausbilder"
    },

    55: {
        name: "Wolf Grab",
        roblox: "@WolfWolfRTXX",
        display: "WolfRTXX",
        rank: "PRA | Polizeiratanwärter"
    },

    99: {
        name: "Tom Wagner",
        roblox: "@Tom_cool187",
        display: "Tom_qp",
        rank: "POR | Polizeioberrat"
    }
};

function renderTable() {
    const table = document.getElementById("employeeTable");
    const search = document.getElementById("search").value.toLowerCase();

    table.innerHTML = "";

    for (let i = 1; i <= 100; i++) {
        const number = "15/" + String(i).padStart(2, "0");
        const employee = employees[i];

        const name = employee ? employee.name : "Nicht besetzt";
        const roblox = employee ? employee.roblox : "—";
        const display = employee ? employee.display : "—";
        const rank = employee ? employee.rank : "—";

        const searchText = (
            number + " " +
            name + " " +
            roblox + " " +
            display + " " +
            rank
        ).toLowerCase();

        if (!searchText.includes(search)) {
            continue;
        }

        const row = document.createElement("tr");

        const values = [
            number,
            name,
            roblox,
            display,
            rank
        ];

        values.forEach((value, index) => {
            const cell = document.createElement("td");
            cell.textContent = value;

            if (index === 0) {
                cell.className = "number";
            }

            if (index === 1 && !employee) {
                cell.className = "free";
            }

            if (index === 4 && employee) {
                cell.className = "rank";
            }

            row.appendChild(cell);
        });

        table.appendChild(row);
    }
}

renderTable();
</script>

</body>
</html>
